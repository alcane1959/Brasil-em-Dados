name: Atualizar dados e publicar Pages

on:
  workflow_dispatch:

  schedule:
    # 09:37, 13:37 e 18:37 no horário de Brasília, de segunda a sexta.
    - cron: '37 12,16,21 * * 1-5'

  push:
    branches:
      - main
    paths-ignore:
      - 'dados/painel.json'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  atualizar-e-publicar:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Atualizar dados oficiais
        run: python scripts/atualizar_dados.py

      - name: Salvar painel.json no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/painel.json

          if ! git diff --cached --quiet; then
            git commit -m "Atualiza indicadores econômicos"
            git push
          fi

      - name: Configurar 
